services:
  backend:
    build:
      context: ./backend
    environment:
      ROBYN_HOST: 0.0.0.0
      ROBYN_PORT: 8080
      CORS_ORIGIN: https://istatus.a3slabs.co.ke
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./web-app
    environment:
      TELEMETRY_API_URL: http://backend:8080/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped


  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    network_mode: host
    depends_on:
      - backend
    restart: unless-stopped
    profiles:
      - tunnel
